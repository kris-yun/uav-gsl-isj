gsl_server:
  ros__parameters:
    method: OPGSL_SCIM_V1
    maxSearchTime: 120.0
    distanceThreshold: -1.0
    useWindGroundTruth: false
    anemometer_frame: base_link
    th_gas_present: 0.1
    th_wind_present: 0.1
    stop_and_measure_time: 2.0
    opgsl:
      v3:
        scientific_mode: true
        seed: 0
        max_steps: 300
        grid: {nx: 30, ny: 30, nz: 1, source_z_min: 0.0, source_z_max: 0.0}
        flight: {nominal_height: 0.30, min_height: 0.30, max_height: 0.30}
        platform: {horizontal_speed_mps: 0.40, vertical_speed_mps: 0.20}
        actions:
          enable_vertical: false
          angular_samples: 16
          radial_samples: 2
          min_radius: 0.60
          max_radius: 1.80
        stop: {credible_mass: 0.90, target_credible_radius_m: 1.50}
        trace: {top_k: 10}
      scim:
        m1_intercept: -0.07913735799581213
        m1_distance_decay: 0.24286946330791737
        wind_noise_sigma: 0.2
        cell_size: 1.0
        cell_size_fallback: false
        min_history: 4
        candidate_cap: 64
        navigation_timeout_seconds: 6.0
        verifier_enabled: false
