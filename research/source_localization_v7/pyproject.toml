[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsl-discrimination"
version = "0.7.0"
description = "Auditable paired-sensing and active counterevidence research for gas source localization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
gsl-v7 = "gsl_discrimination.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gsl_discrimination.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

