name: TNQC static scientific checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ros2_package/src/gsl_server/algorithms/PMFS/internal/TNQCScore.hpp"
      - "ros2_package/src/gsl_server/algorithms/PMFS/internal/Simulations.hpp"
      - "ros2_package/src/gsl_server/algorithms/PMFS/internal/Simulations.cpp"
      - "ros2_package/test/test_tnqc_score.cpp"
      - "reference/tnqc_vgr_offline_240s.py"
      - "reference/tnqc_vgr_fixed_trajectory_replay.py"
      - "reference/test_tnqc_vgr_fixed_trajectory_replay.py"
      - "reference/aggregate_tnqc_vgr_offline_gate.py"
      - "reference/evaluate_tnqc_closed_loop_300s.py"
      - "reference/run_tnqc_vgr_offline_gate_20260920.sh"
      - ".github/workflows/tnqc_static_checks.yml"

permissions:
  contents: write

jobs:
  scientific-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run checks and persist diagnostics
        shell: bash
        run: |
          set +e
          out="evidence/TNQC_STATIC_CHECKS_20260921.txt"
          : > "$out"
          overall=0

          echo "## python-pycompile" >> "$out"
          python3 -m py_compile             reference/tnqc_vgr_offline_240s.py             reference/tnqc_vgr_fixed_trajectory_replay.py             reference/test_tnqc_vgr_fixed_trajectory_replay.py             reference/aggregate_tnqc_vgr_offline_gate.py             reference/evaluate_tnqc_closed_loop_300s.py             >> "$out" 2>&1
          rc=$?
          echo "rc=$rc" >> "$out"
          (( rc == 0 )) || overall=1

          echo "## synthetic-fixed-trajectory" >> "$out"
          PYTHONPATH=reference python3 reference/test_tnqc_vgr_fixed_trajectory_replay.py             >> "$out" 2>&1
          rc=$?
          echo "rc=$rc" >> "$out"
          (( rc == 0 )) || overall=1

          echo "## shell-syntax" >> "$out"
          bash -n reference/run_tnqc_vgr_offline_gate_20260920.sh \
                  reference/run_tnqc_closed_loop_matrix_20260920.sh \
                  >> "$out" 2>&1
          rc=$?
          echo "rc=$rc" >> "$out"
          (( rc == 0 )) || overall=1

          echo "## cpp-tnqc-score" >> "$out"
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG             -Iros2_package/src             ros2_package/test/test_tnqc_score.cpp             -o /tmp/test_tnqc_score             >> "$out" 2>&1
          rc=$?
          echo "compile_rc=$rc" >> "$out"
          if (( rc == 0 )); then
            /tmp/test_tnqc_score >> "$out" 2>&1
            rc=$?
            echo "run_rc=$rc" >> "$out"
          fi
          (( rc == 0 )) || overall=1

          echo "overall_rc=$overall" >> "$out"
          cat "$out"

      - name: Upload diagnostic record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tnqc-static-checks
          path: evidence/TNQC_STATIC_CHECKS_20260921.txt
          if-no-files-found: error

      - name: Enforce pass
        run: |
          grep -q '^overall_rc=0$' evidence/TNQC_STATIC_CHECKS_20260921.txt
