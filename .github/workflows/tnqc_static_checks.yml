name: TNQC static scientific checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tnqc_static_checks.yml'
      - 'reference/tnqc_vgr_offline_240s.py'
      - 'reference/tnqc_vgr_fixed_trajectory_replay.py'
      - 'reference/test_tnqc_vgr_fixed_trajectory_replay.py'
      - 'ros2_package/src/gsl_server/algorithms/PMFS/internal/TNQCScore.hpp'
      - 'ros2_package/test/test_tnqc_score.cpp'

permissions:
  contents: read

jobs:
  scientific-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          set -euo pipefail
          python3 -m py_compile             reference/tnqc_vgr_offline_240s.py             reference/tnqc_vgr_fixed_trajectory_replay.py             reference/test_tnqc_vgr_fixed_trajectory_replay.py             reference/aggregate_tnqc_vgr_offline_gate.py             reference/evaluate_tnqc_closed_loop_300s.py

      - name: Synthetic fixed-trajectory replay audit
        env:
          PYTHONPATH: reference
        run: |
          set -euo pipefail
          python3 reference/test_tnqc_vgr_fixed_trajectory_replay.py

      - name: Standalone TNQC quotient and hierarchy-guard test
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -UNDEBUG             -Iros2_package/src             ros2_package/test/test_tnqc_score.cpp             -o /tmp/test_tnqc_score
          /tmp/test_tnqc_score
