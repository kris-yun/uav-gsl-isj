name: M4-v3 mechanism contract

on:
  push:
    branches:
      - research/m4-v3-interventional-evolution-propagator
    paths:
      - ".github/workflows/m4-v3-mechanism-contract.yml"
      - "research/causal_compositional_plume_world_model_v1/m4_v3_interventional_evolution.py"
      - "research/causal_compositional_plume_world_model_v1/test_m4_v3_mechanism_contract.py"
      - "research/causal_compositional_plume_world_model_v1/export_m4_v3_dynamic_wind_sequence.py"
      - "research/causal_compositional_plume_world_model_v1/m4_v3_d0_house02.py"

permissions:
  contents: read

jobs:
  mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen v3 scripts
        run: |
          python -m py_compile research/causal_compositional_plume_world_model_v1/export_m4_v3_dynamic_wind_sequence.py
          python -m py_compile research/causal_compositional_plume_world_model_v1/m4_v3_interventional_evolution.py
          python -m py_compile research/causal_compositional_plume_world_model_v1/m4_v3_d0_house02.py
      - name: Run structural and synthetic mechanism tests
        run: python research/causal_compositional_plume_world_model_v1/test_m4_v3_mechanism_contract.py
