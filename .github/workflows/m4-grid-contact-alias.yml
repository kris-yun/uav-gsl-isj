name: M4 grid contact alias audit
on:
  push:
    branches: [research/m4-spatial-mechanism-audit-v1]
    paths: [".github/workflows/m4-grid-contact-alias.yml"]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python research/m4_spatial_mechanism_audit_v1/grid_contact_alias_audit.py --repo-root "$GITHUB_WORKSPACE" --output /tmp/grid_alias.json
          cat /tmp/grid_alias.json
