name: House02 subcell wall contact audit
on:
  push:
    branches:
      - research/m4-spatial-mechanism-audit-v1
    paths:
      - ".github/workflows/m4-subcell-wall-contact.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install numpy
      - name: Run source-blind subcell audit
        run: |
          python research/m4_spatial_mechanism_audit_v1/subcell_wall_contact_audit.py --repo-root "$GITHUB_WORKSPACE" --output /tmp/subcell_wall.json
          echo "===SUBCELL_WALL_RESULT==="
          cat /tmp/subcell_wall.json
