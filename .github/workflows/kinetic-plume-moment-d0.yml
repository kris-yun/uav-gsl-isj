name: Kinetic plume moment D0

on:
  push:
    branches:
      - research/kinetic-plume-belief-v1
    paths:
      - ".github/workflows/kinetic-plume-moment-d0.yml"
      - "research/kinetic_plume_belief_v1/kinetic_moment_d0.py"

permissions:
  contents: read

jobs:
  d0:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run kinetic moment D0
        run: |
          python research/kinetic_plume_belief_v1/kinetic_moment_d0.py --repo-root "$GITHUB_WORKSPACE" --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --out /tmp/kinetic_d0
          echo "===KINETIC_D0_RESULT==="
          cat /tmp/kinetic_d0/result.json
