name: M4 vertical frozen surgery only
on:
  push:
    branches:
      - research/m4-vertical-control-v1
    paths:
      - ".github/workflows/m4-vertical-surgery-only.yml"
permissions:
  contents: read
jobs:
  surgery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Frozen surgery
        run: |
          python research/m4_spatial_mechanism_audit_v1/m4_vertical_frozen_surgery.py --repo-root "$GITHUB_WORKSPACE" --output /tmp/vertical_surgery.json
          echo "===VERTICAL_FROZEN_SURGERY_RESULT==="
          cat /tmp/vertical_surgery.json
