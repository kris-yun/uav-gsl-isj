name: M4-v3 W0 wind interface contract

on:
  push:
    branches:
      - research/m4-v3-interventional-evolution-propagator
    paths:
      - ".github/workflows/m4-v3-w0-wind-contract.yml"
      - "research/causal_compositional_plume_world_model_v1/m4_v3_wind_interface_preflight.py"
      - "research/causal_compositional_plume_world_model_v1/test_m4_v3_wind_interface_preflight.py"

permissions:
  contents: read

jobs:
  w0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify canonical downwind-vector contract
        run: python research/causal_compositional_plume_world_model_v1/test_m4_v3_wind_interface_preflight.py
