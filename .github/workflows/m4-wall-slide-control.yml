name: M4 wall-slide physical control

on:
  push:
    branches:
      - research/m4-wall-slide-control-v1
    paths:
      - ".github/workflows/m4-wall-slide-control.yml"
      - "research/m4_spatial_mechanism_audit_v1/m4_wall_slide_control.py"

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Smoke test wall slide
        run: |
          python - <<'PY'
          import importlib.util, json
          p="research/m4_spatial_mechanism_audit_v1/m4_wall_slide_control.py"
          s=importlib.util.spec_from_file_location("ws",p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          r=m.wall_slide_smoke()
          print(json.dumps(r,indent=2))
          assert r["across_wall"] < 1e-8
          assert abs(r["mass_in"]-r["mass_out"]) < 1e-6
          assert r["moved_tangentially"]
          PY
      - name: Train frozen-control split
        run: |
          python research/causal_compositional_plume_world_model_v1/m4_v3_d0_house02.py train --bank evidence/causal_compositional_plume_world_model_v1/c0_5_real_gaden_bank --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --model-script research/m4_spatial_mechanism_audit_v1/m4_wall_slide_control.py --out /tmp/wall_slide_d0 --device cpu --cpu-threads 4
      - name: Evaluate opened S2W2 development holdout
        run: |
          python research/causal_compositional_plume_world_model_v1/m4_v3_d0_house02.py evaluate --bank evidence/causal_compositional_plume_world_model_v1/c0_5_real_gaden_bank --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --model-script research/m4_spatial_mechanism_audit_v1/m4_wall_slide_control.py --out /tmp/wall_slide_d0 --device cpu --cpu-threads 4
          echo "===WALL_SLIDE_D0_RESULT==="
          cat /tmp/wall_slide_d0/d0_result.json
