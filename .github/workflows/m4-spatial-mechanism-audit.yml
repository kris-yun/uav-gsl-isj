name: M4 spatial mechanism oracle kill

on:
  push:
    branches:
      - research/m4-spatial-mechanism-audit-v1
    paths:
      - ".github/workflows/m4-spatial-mechanism-audit.yml"
      - "research/m4_spatial_mechanism_audit_v1/spatial_oracle_kill.py"
      - "research/m4_spatial_mechanism_audit_v1/vertical_oracle_kill.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run kill audit
        run: |
          python research/m4_spatial_mechanism_audit_v1/spatial_oracle_kill.py --repo-root "$GITHUB_WORKSPACE" --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --d0-out evidence/causal_compositional_plume_world_model_v1/m4_v3_d0_house02_20260923 --output /tmp/spatial_oracle.json
          echo "===SPATIAL_ORACLE_RESULT==="
          cat /tmp/spatial_oracle.json
      - name: Run vertical-wind kill audit
        run: |
          python research/m4_spatial_mechanism_audit_v1/vertical_oracle_kill.py --repo-root "$GITHUB_WORKSPACE" --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --d0-out evidence/causal_compositional_plume_world_model_v1/m4_v3_d0_house02_20260923 --output /tmp/vertical_oracle.json
          echo "===VERTICAL_ORACLE_RESULT==="
          cat /tmp/vertical_oracle.json
