name: M4 constraint residual D2

on:
  push:
    branches:
      - research/m4-constraint-residual-v1
    paths:
      - ".github/workflows/m4-constraint-residual-d2.yml"
      - "research/m4_spatial_mechanism_audit_v1/constraint_active_residual_d2.py"

permissions:
  contents: read

jobs:
  d2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run D2
        run: |
          python research/m4_spatial_mechanism_audit_v1/constraint_active_residual_d2.py --repo-root "$GITHUB_WORKSPACE" --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --d0-out evidence/causal_compositional_plume_world_model_v1/m4_v3_d0_house02_20260923 --output-dir /tmp/m4_constraint_d2
          echo "===M4_CONSTRAINT_D2_RESULT==="
          cat /tmp/m4_constraint_d2/d2_result.json
