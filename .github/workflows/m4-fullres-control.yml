name: Frozen M4 full-resolution control

on:
  push:
    branches:
      - research/m4-fullres-control-v1
    paths:
      - ".github/workflows/m4-fullres-control.yml"
      - "research/m4_spatial_mechanism_audit_v1/fullres_frozen_control.py"

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen 0.1m control
        run: |
          python research/m4_spatial_mechanism_audit_v1/fullres_frozen_control.py --repo-root "$GITHUB_WORKSPACE" --dynamic-wind evidence/causal_compositional_plume_world_model_v1/m4_v3_dynamic_wind_house02 --d0-out evidence/causal_compositional_plume_world_model_v1/m4_v3_d0_house02_20260923 --output /tmp/fullres.json
          echo "===FULLRES_RESULT==="
          cat /tmp/fullres.json
